[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "norn-agent"
version = "0.1.0"
description = "Norn Agent Observe SDK for AI agent observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Norn" }]
keywords = ["norn", "agent", "observability", "tracing", "llm"]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Twice908/NORN"
Repository = "https://github.com/Twice908/NORN.git"
Issues = "https://github.com/Twice908/NORN/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/norn_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
