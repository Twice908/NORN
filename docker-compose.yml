name: norn

services:
  norn-timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: norn-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: norn
      POSTGRES_PASSWORD: norn
      POSTGRES_DB: norn
    ports:
      - "5433:5432"
    volumes:
      - norn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norn -d norn"]
      interval: 10s
      timeout: 5s
      retries: 10

  norn-redis:
    image: redis:7-alpine
    container_name: norn-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - norn_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  norn-mailpit:
    image: axllent/mailpit:latest
    container_name: norn-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - norn_mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  norn-db-init:
    image: node:20.18.0-bookworm-slim
    container_name: norn-db-init
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://norn:norn@norn-timescaledb:5432/norn
      PGPASSWORD: norn
    depends_on:
      norn-timescaledb:
        condition: service_healthy
      norn-redis:
        condition: service_healthy
    command: >
      bash -lc "apt-get update && apt-get install -y --no-install-recommends postgresql-client &&
      npm ci &&
      npx prisma migrate deploy --schema packages/db/prisma/schema.prisma &&
        psql -h norn-timescaledb -U norn -d norn -c \"CREATE EXTENSION IF NOT EXISTS timescaledb;\" &&
        psql -h norn-timescaledb -U norn -d norn -f packages/db/prisma/migrations/0002_agent_spans_hypertable/migration.sql"

  norn-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: norn-api
    restart: unless-stopped
    depends_on:
      norn-db-init:
        condition: service_completed_successfully
      norn-redis:
        condition: service_healthy
      norn-timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://norn:norn@norn-timescaledb:5432/norn
      REDIS_URL: redis://norn-redis:6379
      API_KEY_SECRET: ${API_KEY_SECRET:-}
      # The unchanged API still validates this legacy setting at startup. The
      # web app no longer uses the API's Clerk JWT stream path.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-dev-only-unused-clerk-key}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/dashboard}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/dashboard}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@norn.local}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  norn-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: norn-worker
    restart: unless-stopped
    depends_on:
      norn-db-init:
        condition: service_completed_successfully
      norn-redis:
        condition: service_healthy
      norn-timescaledb:
        condition: service_healthy
      norn-mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://norn:norn@norn-timescaledb:5432/norn
      REDIS_URL: redis://norn-redis:6379
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: norn-mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_IGNORE_TLS: "true"
      SMTP_FROM: ${SMTP_FROM:-alerts@norn.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@norn.local}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const fs=require('fs'); const running=fs.readdirSync('/proc').filter(pid => /^\\d+$/.test(pid)).some(pid => { try { return fs.readFileSync('/proc/'+pid+'/cmdline','utf8').includes('dist/index.js') } catch { return false } }); process.exit(running ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  norn-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: norn-web
    restart: unless-stopped
    depends_on:
      norn-api:
        condition: service_healthy
      norn-redis:
        condition: service_healthy
      norn-timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://norn:norn@norn-timescaledb:5432/norn
      REDIS_URL: redis://norn-redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      INGESTION_API_URL: http://norn-api:3001
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@norn.local}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  norn_pgdata:
    name: norn_pgdata
  norn_redisdata:
    name: norn_redisdata
  norn_mailpit-data:
    name: norn_mailpit-data
