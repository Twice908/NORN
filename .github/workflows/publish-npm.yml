name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build npm package
        run: npm run build -w packages/norn-agent

      - name: Publish to npm
        run: npm publish --workspace packages/norn-agent --access public --provenance
